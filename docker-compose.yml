services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Secrets and URLs (TOKEN_ENCRYPTION_KEY, LUMEN_APP_URL, the Google and
    # Microsoft credentials) live in `.env` on the host. The image carries no
    # configuration of its own.
    env_file:
      - .env
    environment:
      # Relative to the container's /app, and therefore inside the volume below.
      # Set DATABASE_URL in `.env` to point at a remote libSQL database instead.
      - DATABASE_URL=${DATABASE_URL:-file:./data/lumen.db}
    ports:
      - '3251:3000'
    volumes:
      # The database, its WAL sidecars, the request log and the attachment cache.
      # Losing this volume means every mailbox has to be re-authenticated.
      - lumen-data:/app/data
      # The logs also live on the host, next to this file, so a 502 can be read
      # with `tail -f logs/app.log` instead of `docker compose exec`. Remove this
      # line and they stay inside the volume, only reachable through the
      # container. This shadowing mount is why APP_LOG_DIR must keep its default
      # (`data/logs`); pointing it elsewhere puts the files back in the volume.
      - ./logs:/app/data/logs

volumes:
  lumen-data:
