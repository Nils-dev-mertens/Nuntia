services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # The Dockerfile's last stage is `mcp`; without this, Compose builds that
      # stage and the app container runs the MCP server on 3333.
      target: app
    restart: unless-stopped
    # Secrets and URLs (TOKEN_ENCRYPTION_KEY, LUMEN_APP_URL, the Google and
    # Microsoft credentials) live in `.env` on the host. The image carries no
    # configuration of its own.
    env_file:
      - .env
    environment:
      # Relative to the container's /app, and therefore inside the volume below.
      # Set DATABASE_URL in `.env` to point at a remote libSQL database instead.
      - DATABASE_URL=${DATABASE_URL:-file:./data/lumen.db}
      # The endpoint Settings → AI agents puts into generated client configs.
      # MCP is published on 3253; set this to a proxied or public URL if agents
      # connect from outside the host.
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-http://127.0.0.1:3253/}
    ports:
      - '3251:3000'
    # The app's `/healthz` is answered only after `initDatabase()` has applied
    # migrations and repairs, so "healthy" is also the signal MCP waits for.
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      # The database, its WAL sidecars, the request log and the attachment cache.
      # Losing this volume means every mailbox has to be re-authenticated.
      - lumen-data:/app/data
      # The logs also live on the host, next to this file, so a 502 can be read
      # with `tail -f logs/app.log` instead of `docker compose exec`. Remove this
      # line and they stay inside the volume, only reachable through the
      # container. This shadowing mount is why APP_LOG_DIR must keep its default
      # (`data/logs`); pointing it elsewhere puts the files back in the volume.
      - ./logs:/app/data/logs

  # MCP endpoint for AI agents. Part of the default stack, so every deploy
  # rebuilds and recreates it with the app. It publishes on loopback by default
  # (MCP_BIND overrides the address), because the bearer credential is a session
  # cookie and therefore access to the whole mailbox. It shares lumen-data with
  # the app, which means two processes open the same SQLite file — fine for the
  # light traffic of an agent, but it is the limitation the Postgres migration
  # exists to remove.
  # See docs/mcp.md.
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:./data/lumen.db}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3333
    ports:
      # Loopback unless MCP_BIND says otherwise. A Cloudflare Tunnel running as
      # a container on the host connects to the host's own address (the tailnet
      # IP, for instance), which loopback-only publishing refuses; set MCP_BIND
      # to that address in `.env`. Keep it off the public interface: no host
      # firewall protects the container's port, only the bind address does.
      - '${MCP_BIND:-127.0.0.1}:3253:3333'
    volumes:
      - lumen-data:/app/data
    # Waiting for healthy, not merely started, means the app has finished
    # `initDatabase()` before MCP touches the same file. Without it both
    # processes could run the migration runner at the same time.
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3333/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The public page, on its own hostname. The app serves / as the inbox, so the
  # two cannot share a port. PUBLIC_APP_URL is baked into Sign in and Request
  # access at build time: changing LUMEN_APP_URL in `.env` needs a rebuild of
  # this service (`docker compose build landing`), not a restart.
  landing:
    build:
      context: ./landing
      args:
        PUBLIC_APP_URL: ${LUMEN_APP_URL:-http://localhost:3251}
    restart: unless-stopped
    ports:
      - '3252:80'

volumes:
  lumen-data:
