name: CI

# The test action from issue #1: every pull request has to prove the app still
# typechecks, passes the unit suite, and performs the core actions in a browser.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  # A newer push to the same branch makes the older run pointless. Cancelling is
  # safe here, unlike the deploy: nothing is listening on the result.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Pinned to the same Bun the Dockerfile builds with, so CI cannot pass on
      # a runtime production does not use.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `src/routeTree.gen.ts` is generated and gitignored, so a fresh clone has
      # none of it. Without it every `createFileRoute` falls back to the
      # unregistered types — each path becomes "not assignable to 'undefined'"
      # and every `useParams` a `never` — so the check has to run first.
      - name: Generate the route tree
        run: bun run generate-routes

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      # `--with-deps` installs the system libraries Chromium needs on the runner.
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bunx playwright test

      # Always, not only on failure: a pull request should be able to read the
      # report of a green run too, and the trace of a retry is gone once the job
      # ends. `test-results` holds the traces and screenshots that go with it.
      - name: Upload the end-to-end report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
