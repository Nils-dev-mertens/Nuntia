name: Deploy

on:
  push:
    branches: [master]

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Join the tailnet so the runner can reach the server, which is not
      # exposed to the public internet.
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      # Password-based SSH, so there is no key to install on the server.
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.TS_USER }}@${{ secrets.TS_HOST }} "
            cd /home/${{ secrets.TS_USER }}/Desktop/Lumix
            git checkout master
            git pull
            docker compose build
            docker compose down
            docker compose up -d --remove-orphans
            docker image prune -f
          "
