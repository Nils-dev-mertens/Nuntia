name: Deploy

on:
  push:
    branches: [master]

concurrency:
  group: production
  # Queued rather than cancelled: a run interrupted between `docker compose down`
  # and `up -d` leaves the server with nothing listening.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Join the tailnet so the runner can reach the server, which is not
      # exposed to the public internet.
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      # Password-based SSH, so there is no key to install on the server.
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy
        run: |
          # `set -e` on the remote side, not just here: without it a failed pull or
          # build still runs the teardown and restarts the previous image, and the
          # job reports success while the new code was never deployed.
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.TS_USER }}@${{ secrets.TS_HOST }} '
            set -euo pipefail
            cd /home/${{ secrets.TS_USER }}/Desktop/Lumix
            git checkout master
            git pull
            docker compose build
            docker compose down
            docker compose up -d --remove-orphans
            docker image prune -f
          '
