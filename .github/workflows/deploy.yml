name: Deploy

# Triggered by CI finishing, not by the push itself. Deploying on the push
# meant a run that started alongside the tests: a red master still shipped,
# because the two jobs never waited for each other.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

concurrency:
  group: production
  # Queued rather than cancelled: a run interrupted between `docker compose down`
  # and `up -d` leaves the server with nothing listening.
  cancel-in-progress: false

jobs:
  deploy:
    # A red or cancelled CI run — a superseded push is cancelled by CI's own
    # concurrency group — ends here instead of reaching the server.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # The commit CI actually tested. By the time this runs master may already
      # have moved on to a commit whose tests have not finished.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Join the tailnet so the runner can reach the server, which is not
      # exposed to the public internet.
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      # Password-based SSH, so there is no key to install on the server.
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy
        run: |
          # `set -e` on the remote side, not just here: without it a failed fetch or
          # build still runs the teardown and restarts the previous image, and the
          # job reports success while the new code was never deployed.
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.TS_USER }}@${{ secrets.TS_HOST }} '
            set -euo pipefail
            cd /home/${{ secrets.TS_USER }}/Desktop/Lumix
            git checkout master
            git fetch origin
            # The tested commit, not whatever master points at now: pulling
            # could land a later push that has not been through CI.
            git reset --hard ${{ github.event.workflow_run.head_sha }}
            docker compose build
            docker compose down
            docker compose up -d --remove-orphans
            docker image prune -f
          '
