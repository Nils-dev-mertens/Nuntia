# The landing page is one static file and a few hashed assets: no routing, no
# fallback. gzip is on because the hero island is the largest thing served.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Astro's asset filenames carry a content hash, so a new build never reuses
    # one and the old copy can be cached for a year.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
